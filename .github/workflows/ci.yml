name: Validar CRM
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crm:ci-only-password@127.0.0.1:5432/crm_test
      DATABASE_URL_UNPOOLED: postgres://crm:ci-only-password@127.0.0.1:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run hermes:test
      - run: npm run prospecting:test
      - run: npm run db:migrate
      - run: npm run crm:check
      - run: npm run auth:check
      - run: npm run access-media-webhooks:check
      - run: npm run asaas:check-webhook
      - run: npm run google-calendar:check-actions
      - run: npm run whatsapp:check-ai
      - run: npm run sales:check
      - run: npm run build
