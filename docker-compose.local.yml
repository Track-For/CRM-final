name: crm-mentoria-local
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_mentoria
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Execute npm run db:local primeiro}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_mentoria"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  crm_postgres:
